<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Staff sign-in | FeeArmor</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/site.css">
<style>
  main { min-height: calc(100vh - 68px); display: flex; align-items: center; background: #F5F7FA; color: #1A2332; }
  .box { max-width: 380px; margin: 0 auto; width: 100%; }
  .box .card { display: grid; gap: 14px; }
</style>
</head>
<body>
<header><div class="wrap"><a class="wordmark" href="/" aria-label="FeeArmor"><img src="/logo.svg" alt="" width="34" height="34"><span>Fee<span class="lime">Armor</span></span></a></div></header>
<main class="off">
  <div class="wrap box">
    <form class="card" method="POST" action="/dashboard/login">
      <h1 style="font-size:24px;margin:0">Staff sign-in</h1>
      <p class="form-error" id="bad" hidden>Wrong name or password.</p>
      <div><label for="name">Your name</label><input id="name" name="name" type="text" autocomplete="username" required></div>
      <div><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required
        style="width:100%;min-height:52px;padding:0 16px;border:1.5px solid #CBD6E2;border-radius:10px;font:inherit;font-size:17px"></div>
      <button class="btn btn-block" type="submit">Sign in</button>
    </form>
  </div>
</main>
<script>if (location.search.indexOf('bad=1') > -1) document.getElementById('bad').hidden = false;</script>
</body>
</html>

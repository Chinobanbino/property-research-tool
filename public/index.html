<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Property Research Tool</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#f5f5f5; color:#1a1a1a; padding:24px; }
.wrap { max-width:1100px; margin:0 auto; }
h1 { font-size:26px; margin-bottom:4px; }
.sub { color:#666; font-size:14px; margin-bottom:24px; }
.searchbox { background:#fff; padding:20px; border-radius:12px; border:1px solid #e0e0e0; margin-bottom:20px; display:flex; gap:10px; }
.searchbox input { flex:1; padding:12px 14px; border:1px solid #ddd; border-radius:8px; font-size:15px; }
.searchbox input:focus { outline:none; border-color:#2f6fed; }
.searchbox button { padding:12px 26px; background:#2f6fed; color:#fff; border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; }
.searchbox button:disabled { opacity:.6; cursor:default; }
.err { background:#fdecec; border:1px solid #f3b5b5; color:#b32020; padding:12px 14px; border-radius:8px; margin-bottom:16px; font-size:14px; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px; }
.card { background:#fff; border:1px solid #e0e0e0; border-radius:12px; padding:18px; }
.card h3 { font-size:11px; letter-spacing:.6px; text-transform:uppercase; color:#888; margin-bottom:10px; }
.lbl { font-size:12px; color:#999; margin-top:8px; }
.val { font-size:15px; font-weight:500; margin:3px 0 6px; word-break:break-word; }
.pill { display:inline-block; padding:5px 11px; border-radius:6px; font-size:12px; font-weight:600; margin-top:6px; }
.hi { background:#fdecec; color:#b32020; }
.lo { background:#e6f5ec; color:#126b45; }
.unk { background:#fdf2dd; color:#8a5a08; }
.card a { color:#2f6fed; font-size:14px; text-decoration:none; display:inline-block; margin-top:10px; }
.card a:hover { text-decoration:underline; }
.card button { margin-top:10px; padding:7px 12px; font-size:13px; background:#f2f2f2; border:1px solid #ddd; border-radius:6px; color:#2f6fed; cursor:pointer; }
.pts div { font-size:14px; color:#555; margin:7px 0; }
.note { margin-top:20px; background:#fff; border:1px solid #e0e0e0; border-radius:12px; padding:16px; font-size:14px; color:#555; }
.leads { background:#fff; padding:16px 20px; border-radius:12px; border:1px solid #e0e0e0; margin-top:20px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; font-size:14px; }
.leads h3 { width:100%; font-size:11px; letter-spacing:.6px; text-transform:uppercase; color:#888; }
.leads select, .leads input { padding:8px 10px; border:1px solid #ddd; border-radius:6px; font-size:14px; width:120px; }
.leads button { padding:9px 16px; background:#2f6fed; color:#fff; border:none; border-radius:6px; font-size:14px; font-weight:600; cursor:pointer; }
.leads .lbl { width:100%; margin-top:0; }
.empty { text-align:center; padding:50px 20px; color:#999; background:#fff; border-radius:12px; border:1px solid #e0e0e0; }
</style>
</head>
<body>
<div class="wrap">
<h1>Property research tool</h1>
<div class="sub">Pre-qualification research before the call</div>

<div class="searchbox">
<input type="text" id="addr" placeholder="123 Main St, Terrell, TX" />
<button id="btn" onclick="run()">Research</button>
</div>

<div id="err"></div>
<div id="out"><div class="empty">Enter an address to start</div></div>

<div class="leads">
<h3>Delinquent tax lead list</h3>
<select id="lcounty"><option value="dallas">Dallas</option><option value="tarrant">Tarrant</option></select>
<input type="number" id="lowed" placeholder="Min owed $" min="0" />
<input type="number" id="lyears" placeholder="Min years" min="0" />
<input type="text" id="lzip" placeholder="Zip (optional)" />
<button onclick="downloadLeads()">Download CSV</button>
<div class="lbl" id="lstatus"></div>
</div>
</div>

<script>
async function run() {
  var addr = document.getElementById('addr').value.trim();
  var err = document.getElementById('err');
  var out = document.getElementById('out');
  var btn = document.getElementById('btn');

  err.innerHTML = '';
  if (!addr) { err.innerHTML = '<div class="err">Enter a property address</div>'; return; }

  btn.disabled = true;
  btn.textContent = 'Researching...';
  out.innerHTML = '<div class="empty">Looking up property...</div>';

  try {
    var r = await fetch('/api/research', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ address: addr })
    });
    var j = await r.json();

    if (!r.ok) {
      err.innerHTML = '<div class="err">' + j.error + '</div>';
      out.innerHTML = '<div class="empty">Enter an address to start</div>';
      return;
    }

    var d = j.data;
    var fc = d.floodRisk === 'high' ? 'hi' : (d.floodRisk === 'low' ? 'lo' : 'unk');
    var ft = d.floodRisk === 'high' ? 'High risk' : (d.floodRisk === 'low' ? 'Low risk' : (d.floodRisk === 'moderate' ? 'Moderate risk' : 'Unverified'));
    var approxWarn = d.approximate
      ? '<div class="pill unk" style="display:block;margin-top:8px;line-height:1.4">Approximate location - this is the nearest street or town, not the parcel. Verify the zone in the CAD map before using it on the call.</div>'
      : '';
    var floodDetail = '';
    if (d.floodSubtype) { floodDetail += '<div class="lbl">Subtype</div><div class="val">' + d.floodSubtype + '</div>'; }
    if (d.bfe) { floodDetail += '<div class="lbl">Base flood elevation</div><div class="val">' + d.bfe + '</div>'; }
    if (d.inSFHA === true) { floodDetail += '<div class="lbl">Special flood hazard area</div><div class="val">Yes - insurance likely required</div>'; }

    var links = '';
    if (d.appraisalUrl) { links += '<a href="' + d.appraisalUrl + '" target="_blank">Appraisal district - lot size, sqft, year built</a><br>'; }
    if (d.taxUrl) { links += '<a href="' + d.taxUrl + '" target="_blank">Tax collector - delinquencies and amount owed</a><br>'; }
    if (d.deedsUrl) { links += '<a href="' + d.deedsUrl + '" target="_blank">County clerk - deeds and liens</a><br>'; }
    if (d.netrUrl) { links += '<a href="' + d.netrUrl + '" target="_blank">All county records (NETR)</a>'; }
    var countyCard = '<div class="val">' + d.county + '</div>' + (links || '<div class="lbl">No links configured</div>');

    var t = d.taxStatus;
    var taxCard;
    if (!t) {
      taxCard = '<span class="pill unk">Not available for this county</span>'
        + '<div class="lbl">' + (d.approximate ? 'Approximate location - check the tax office by hand' : 'Use the tax collector link in County records') + '</div>';
    } else if (!t.available) {
      taxCard = '<span class="pill unk">Tax data not loaded</span><div class="lbl">' + t.reason + '</div>';
    } else if (!t.matchAttempted) {
      taxCard = '<span class="pill unk">Match not attempted</span><div class="lbl">' + t.reason + '</div>';
    } else if (t.delinquent) {
      var rec = t.record;
      taxCard = '<span class="pill hi">Delinquent - $' + rec.totalOwed.toLocaleString('en-US') + ' / ' + rec.yearsOwed + ' yr' + (rec.yearsOwed === 1 ? '' : 's') + '</span>'
        + '<div class="lbl">Owner</div><div class="val">' + rec.owner + '</div>'
        + '<div class="lbl">Mailing address</div><div class="val">' + rec.mailingAddress + ' ' + rec.mailCity + ' ' + rec.mailState + ' ' + rec.mailZip + '</div>'
        + '<div class="lbl">Account / tax years</div><div class="val">' + rec.account + ' / ' + rec.years.join(', ') + '</div>';
    } else {
      taxCard = '<span class="pill lo">Current</span><div class="lbl">Not on the county delinquent list</div>';
    }
    if (t && t.dataAsOf) { taxCard += '<div class="lbl">Tax roll loaded ' + new Date(t.dataAsOf).toLocaleDateString() + '</div>'; }

    out.innerHTML =
      '<div class="grid">'
      + '<div class="card"><h3>Location</h3>'
      + '<div class="lbl">Matched address</div><div class="val">' + d.address + '</div>'
      + '<div class="lbl">Coordinates</div><div class="val">' + d.coordinates + '</div>'
      + '<button onclick="cp(\'' + d.coordinates + '\')">Copy coords</button><br>'
      + '<a href="' + d.mapsLink + '" target="_blank">Open in Google Maps</a></div>'

      + '<div class="card"><h3>Flood zone</h3>'
      + '<div class="lbl">FEMA zone</div><div class="val">' + d.floodZone + '</div>'
      + floodDetail
      + '<span class="pill ' + fc + '">' + ft + '</span>'
      + approxWarn
      + '<br><a href="https://msc.fema.gov/portal/search" target="_blank">Verify on FEMA map</a></div>'

      + '<div class="card"><h3>County records</h3>' + countyCard + '</div>'

      + '<div class="card"><h3>Tax status</h3>' + taxCard + '</div>'

      + '<div class="card"><h3>Leverage points</h3><div class="pts">'
      + d.leveragePoints.map(function(p){ return '<div>- ' + p + '</div>'; }).join('')
      + '</div></div>'
      + '<div class="note">Next: call the seller, confirm lot details, then log it in Podio once numbers are final.</div>';
  } catch (e) {
    err.innerHTML = '<div class="err">Something went wrong. Try again.</div>';
    out.innerHTML = '<div class="empty">Enter an address to start</div>';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Research';
  }
}

function downloadLeads() {
  var q = new URLSearchParams({
    county: document.getElementById('lcounty').value,
    minOwed: document.getElementById('lowed').value,
    minYears: document.getElementById('lyears').value,
    zip: document.getElementById('lzip').value.trim()
  });
  window.location = '/api/delinquent.csv?' + q.toString();
}

async function loadTaxStatus() {
  try {
    var s = await (await fetch('/api/taxroll/status')).json();
    document.getElementById('lstatus').textContent = Object.keys(s).map(function(k) {
      var c = s[k];
      return c.county + ': ' + (c.loadedAt ? c.delinquentAccounts.toLocaleString('en-US') + ' delinquent accounts' : (c.error || 'loading'));
    }).join(' | ');
  } catch (e) {}
}
loadTaxStatus();

function cp(t) {
  navigator.clipboard.writeText(t);
}

document.getElementById('addr').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') run();
});
</script>
</body>
</html>
